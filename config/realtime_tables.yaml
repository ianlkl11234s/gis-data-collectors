# Supabase live / spatial / reference 表清冊
#
# 用途：
#   tasks/daily_report.py 的 _section_supabase_realtime 用此清單呼叫 RPC
#   public.health_snapshot()（見 gis-platform/migrations/306_health_snapshot_public.sql）
#   一次撈所有表的寫入新鮮度，依 expected_interval_min 判定 STALE / OK / DEAD。
#   tasks/staleness_watch.py（即時「太久沒新資料」告警）只讀本檔的 owner_collector／
#   expected_interval_min／event_driven／active_window 決定門檻，**不呼叫 RPC**。
#
# 維護規則（重要）：
#   每次 cross_layer_map.yaml 改動後，務必同步本檔！見 .claude/CLAUDE.md
#
# 欄位：
#   schema                : 'live' | 'spatial' | 'reference' | 'public'
#   table                 : 表名
#   time_column           : 用什麼欄位算 max() 看新鮮度（預設 collected_at，部分表是 observed_at / occurred_at 等）
#   owner_collector       : cross_layer_map.yaml 裡的 collector key
#   expected_interval_min : 期望寫入頻率（分鐘）
#   critical              : 日報加重標記（DEAD 時整體 🔴）；不影響即時告警
#   notes                 : 自由備註
#   label                 : 日報顯示的中文名稱（必填，測試守門；缺時退回表名）
#   event_driven          : true＝有事件才寫（地震、火山、旱災公告、梅雨速報…），「多久沒新資料」
#                           不代表壞掉 → 不列入日報停更清單；即時告警（tasks/staleness_watch.py）
#                           對「表全是 event_driven」的收集器改看最後成功執行時間。
#   active_window         : {from: "MM-DD", to: "MM-DD"}（台北日期、含頭尾、可跨年）；季節外不檢查停更
#                           （收集器的表全在季外時，即時告警也不檢查）
#   enabled               : false＝寫入端已停（例：外部 writer 停機），不檢查停更
#   ※ owner_collector 在 cross_layer_map.yaml 停用（enabled:false 或 deployment:disabled）且沒有
#     其他啟用中的 collector 也寫這張表時，同樣不檢查停更（tasks/monitoring.stale_check_skip_reason）。

gfw_hourly_publish_monitor:
  # GFW source observations are expected five UTC days behind. This is source
  # availability, not a seven-day frontend display-window allowance.
  source_lag_days: 5
  # Daily publisher plus operational grace. The source-date cutoff uses
  # (UTC now - this grace) before subtracting source lag; a newer started_at
  # never masks a failed run or an old current release.
  schedule_grace_hours: 30

