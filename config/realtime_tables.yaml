  # 原本「不得監控尚未核准的表名」的理由已不成立 —— 也正是這個盲區讓 GDELT
  # pipeline 停滯 29 小時都沒有任何告警。health_snapshot 是 SECURITY DEFINER
  # 且 monitoring 走 SUPABASE_DB_URL（與 writer 同一條連線），所以 intel schema
  # 的 FORCE RLS 不擋；若日報出現 permission denied，需要補 grant（見 PR）。
  - {schema: intel, table: global_event_candidate_observations, label: 全球事件候選, time_column: available_at, owner_collector: global_events, expected_interval_min: 60, critical: false, notes: AI 候選觀測（migration 397）；pending/assessed 皆會寫入}
