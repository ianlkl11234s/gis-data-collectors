# JMA 紫外線 UV インデックス解析（uvi_anal，每正時 06–18 JST，每小時約 20 分更新）→ UVI 級距
# 依據（2026-10-12 實測）：
#   * 圖磚 PNG 4-bit palette 15 entries；tRNS idx0=0（透明＝解析範圍外），idx1–14 alpha=204。
#   * 凡例 env/uvindex/uvimg/uvi_colorbox.png（0、1、2…12、13+ 共 14 格）逐格取色與 PLTE 對照：
#     legend 10/11/12 為 (163,0,28)/(180,0,89)/(202,0,158)，PLTE 為 (165,0,33)/(181,0,91)/(204,0,160)（反鋸齒差異）→ 以 PLTE 為準。
# ⚠ 級距編碼：grid 值 0＝透明（範圍外，不是 UVI 0）；level＝UVI＋1（level 1＝UVI 0 … level 14＝UVI≥13）；255＝缺測／表外顏色。
version: jma-uv_anal-2026-10-12
product: uv_anal
source_url: https://www.data.jma.go.jp/env/uvindex/tile/uv/uv_a/{vt}/uvi_anal/{vt}/surf/uvi_anal/{z}/{x}/{y}.png
effective_from: "2026-10-12"
palette_basis: plte
plte_verified: true
native_zooms: [5, 6, 7, 8]      # 前端 minZoom 5／maxZoom 8；z≤4、z≥9 回 404。解析格約 0.25°（z5 約 5 px／格），收 z5 不失值
rgb_tolerance: 0
levels:
  - {level: 1,  rgb: [255, 255, 255], palette_index: 1,  label: "UVI 0"}
  - {level: 2,  rgb: [217, 217, 255], palette_index: 2,  label: "UVI 1"}
  - {level: 3,  rgb: [153, 203, 255], palette_index: 3,  label: "UVI 2"}
  - {level: 4,  rgb: [255, 255, 190], palette_index: 4,  label: "UVI 3"}
  - {level: 5,  rgb: [250, 250, 150], palette_index: 5,  label: "UVI 4"}
  - {level: 6,  rgb: [250, 245, 0],   palette_index: 6,  label: "UVI 5"}
  - {level: 7,  rgb: [255, 200, 0],   palette_index: 7,  label: "UVI 6"}
  - {level: 8,  rgb: [255, 140, 0],   palette_index: 8,  label: "UVI 7"}
  - {level: 9,  rgb: [250, 90, 0],    palette_index: 9,  label: "UVI 8"}
  - {level: 10, rgb: [255, 20, 0],    palette_index: 10, label: "UVI 9"}
  - {level: 11, rgb: [165, 0, 33],    palette_index: 11, label: "UVI 10"}
  - {level: 12, rgb: [181, 0, 91],    palette_index: 12, label: "UVI 11"}
  - {level: 13, rgb: [204, 0, 160],   palette_index: 13, label: "UVI 12"}
  - {level: 14, rgb: [204, 0, 204],   palette_index: 14, label: "UVI ≥13"}
count_thresholds:                # 每日彙總 count_ge_{k}（k 為 level；UVI＝k−1）
  - {k: 4,  meaning: "UVI≥3（中程度以上）"}
  - {k: 7,  meaning: "UVI≥6（強い以上）"}
  - {k: 9,  meaning: "UVI≥8（非常に強い以上）"}
  - {k: 12, meaning: "UVI≥11（極端に強い）"}
