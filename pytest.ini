[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live_supabase: requires --run-live-supabase and TEST_SUPABASE_DB_URL
    expects_network_block: verifies that an external transport is denied and redacted
# 避免測試用到真實 .env
addopts = -v --tb=short
